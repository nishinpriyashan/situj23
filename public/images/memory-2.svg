<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36173d" />
      <stop offset="50%" stop-color="#582452" />
      <stop offset="100%" stop-color="#7e326b" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe1ec" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe1ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <circle cx="300" cy="250" r="180" fill="url(#glow2)"/>
  
  <!-- Chocolate bar & sweet treats artwork -->
  <g transform="translate(300, 240)">
    <!-- Chocolate bar -->
    <rect x="-80" y="-60" width="160" height="110" rx="12" fill="#44211b" stroke="#f7b8d0" stroke-width="3"/>
    <rect x="-70" y="-50" width="40" height="40" rx="4" fill="#623129"/>
    <rect x="-20" y="-50" width="40" height="40" rx="4" fill="#623129"/>
    <rect x="30" y="-50" width="40" height="40" rx="4" fill="#623129"/>
    <rect x="-70" y="0" width="40" height="40" rx="4" fill="#623129"/>
    <rect x="-20" y="0" width="40" height="40" rx="4" fill="#623129"/>
    <rect x="30" y="0" width="40" height="40" rx="4" fill="#623129"/>
    
    <!-- Heart wrapper ribbon -->
    <path d="M-85,-10 C-40,-15 40,-15 85,-10 L85,25 C40,20 -40,20 -85,25 Z" fill="#b9a0f5" opacity="0.9"/>
    <text x="0" y="14" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#170d2e" text-anchor="middle" letter-spacing="2">SWEET TREATS</text>
  </g>
  
  <!-- Floating hearts and candies -->
  <path d="M160,160 C160,140 140,120 120,140 C100,120 80,140 80,160 C80,190 120,220 120,230 C120,220 160,190 160,160 Z" fill="#f7b8d0" opacity="0.6" transform="scale(0.5) translate(200, 100)"/>
  <path d="M160,160 C160,140 140,120 120,140 C100,120 80,140 80,160 C80,190 120,220 120,230 C120,220 160,190 160,160 Z" fill="#ffe1ec" opacity="0.7" transform="scale(0.4) translate(950, 400)"/>

  <!-- Frame -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#f7b8d0" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" rx="16"/>

  <text x="300" y="470" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#fff8fc" text-anchor="middle">
    Chocolates & Foodie Dates
  </text>
  <text x="300" y="510" font-family="'Outfit', sans-serif" font-size="16" fill="#f7b8d0" text-anchor="middle" letter-spacing="1">
    [ Click to add your personal photo ]
  </text>
</svg>
